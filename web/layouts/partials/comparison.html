{{- /* Map of urlized name -> result, matching checkbox values on the results table. */ -}}
{{- $results := dict -}}
{{- range .Site.Data.results.items -}}
  {{- $results = merge $results (dict (urlize .name) .) -}}
{{- end -}}

<p class="comparison-back"><a href="{{ "/" | relURL }}">&larr; Back to all results</a></p>

<div id="comparison-summary"></div>
<div id="comparison-charts"></div>

<script id="comparison-data" type="application/json">{{ $results | jsonify | safeJS }}</script>
<script>
(function () {
  var results = JSON.parse(document.getElementById('comparison-data').textContent);

  // Each metric: title, unit, value getter, and whether lower values are better.
  function get(path) {
    return function (r) {
      return path.split('.').reduce(function (o, k) { return o == null ? null : o[k]; }, r);
    };
  }
  var metrics = [
    { title: 'Geekbench 6 (single-core)', unit: '', value: get('geekbench_6.single') },
    { title: 'Geekbench 6 (multi-core)', unit: '', value: get('geekbench_6.multi') },
    { title: 'HPL', unit: 'Gflops', value: get('hpl_gflops') },
    { title: 'HPL Efficiency', unit: 'Gflops/W', decimals: 2, value: function (r) {
        var g = r.hpl_gflops, w = r.power_watts && r.power_watts.hpl;
        return g && w ? g / w : null;
      } },
    { title: 'Power (idle)', unit: 'W', lower: true, value: get('power_watts.idle') },
    { title: 'Power (stress)', unit: 'W', lower: true, value: get('power_watts.stress') },
    { title: 'Network', unit: 'Mbps', value: get('network_mbps.primary') },
    { title: 'WiFi', unit: 'Mbps', value: get('network_mbps.wifi') },
    { title: 'GLMark2', unit: '', value: get('gpu.glmark2') },
    { title: 'vkmark', unit: '', value: get('gpu.vkmark') },
    { title: 'Memory (memcpy)', unit: 'MB/s', value: get('memory_mb_sec.memcpy') },
    { title: 'Memory (memset)', unit: 'MB/s', value: get('memory_mb_sec.memset') },
    { title: 'Encode MP3', unit: 'sec', lower: true, value: get('phoronix.encode_mp3_sec') },
    { title: 'x264 (1080p)', unit: 'fps', value: get('phoronix.x264_1080p_fps') },
    { title: 'x264 (4K)', unit: 'fps', value: get('phoronix.x264_4k_fps') },
    { title: 'PHPBench', unit: '', value: get('phoronix.phpbench') },
    { title: 'Linux compile', unit: 'sec', lower: true, value: get('phoronix.linux_recompile_sec') },
    { title: 'Price (as tested)', unit: '', prefix: '$', decimals: 2, lower: true, value: get('price_as_tested') }
  ];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function fmt(m, v) {
    var opts = m.decimals != null
      ? { minimumFractionDigits: m.decimals, maximumFractionDigits: m.decimals }
      : { maximumFractionDigits: 3 };
    return (m.prefix || '') + v.toLocaleString('en-US', opts) + (m.unit ? ' ' + m.unit : '');
  }

  function render() {
    var summary = document.getElementById('comparison-summary');
    var charts = document.getElementById('comparison-charts');
    summary.textContent = '';
    charts.textContent = '';

    var ids = window.location.hash.replace(/^#/, '').split(',')
      .map(function (s) { try { return decodeURIComponent(s); } catch (e) { return ''; } })
      .filter(function (id, i, a) { return results[id] && a.indexOf(id) === i; });

    if (!ids.length) {
      summary.appendChild(el('p', null,
        'No computers selected. Go back to the results table, check the computers you want to compare, and click Compare.'));
      return;
    }

    // List of selected computers, linked to their reviews.
    var list = el('ul', 'comparison-list');
    ids.forEach(function (id) {
      var r = results[id], li = el('li');
      var a = el('a', null, r.name);
      a.href = r.link;
      li.appendChild(a);
      li.appendChild(document.createTextNode(' (' + [r.arch, r.year].filter(Boolean).join(', ') + ')'));
      list.appendChild(li);
    });
    summary.appendChild(list);

    metrics.forEach(function (m) {
      var chart = buildChart(m, ids);
      if (chart) charts.appendChild(renderChart(chart));
    });
  }

  // Pick a "nice" axis maximum and tick step (1, 2, 2.5 or 5 x 10^n) for ~4-5 intervals.
  function niceScale(max) {
    var rough = max / 4;
    var mag = Math.pow(10, Math.floor(Math.log10(rough)));
    var step = [1, 2, 2.5, 5, 10].map(function (f) { return f * mag; })
      .filter(function (s) { return s >= rough; })[0];
    var top = Math.ceil(max / step) * step;
    var ticks = [];
    for (var t = 0; t <= top + step / 1e6; t += step) ticks.push(t);
    return { max: top, ticks: ticks };
  }

  function tickLabel(m, v) {
    var opts = v >= 10000
      ? { notation: 'compact', maximumFractionDigits: 1 }
      : { maximumFractionDigits: 2 };
    return (m.prefix || '') + v.toLocaleString('en-US', opts);
  }

  function buildChart(m, ids) {
    var rows = ids.map(function (id) {
      var v = m.value(results[id]);
      v = typeof v === 'number' && isFinite(v) ? v : null;
      return { name: results[id].name, value: v, text: v === null ? 'No data' : fmt(m, v) };
    });
    var max = Math.max.apply(null, rows.map(function (r) { return r.value || 0; }));
    if (!(max > 0)) return null; // No data for any selected computer.
    var scale = niceScale(max);
    return {
      metric: m,
      // Subtitle under the plain title (page and PNG), e.g. "(Gflops, higher is better)".
      pngSubtitle: '(' + (m.unit ? m.unit + ', ' : '') + (m.lower ? 'lower' : 'higher') + ' is better)',
      rows: rows,
      max: scale.max,
      ticks: scale.ticks.map(function (t) { return { value: t, text: tickLabel(m, t) }; })
    };
  }

  function renderChart(c) {
    var n = c.rows.length;
    var fig = el('figure', 'compare-chart');
    var cap = el('figcaption', null, c.metric.title);
    cap.appendChild(el('span', 'compare-note', c.pngSubtitle));
    fig.appendChild(cap);

    var grid = el('div', 'compare-rows');
    // Explicit row placement: desktop puts label and bar side by side (--r);
    // mobile stacks the label above its bar (--rm).
    function place(e, r, rm) {
      e.style.setProperty('--r', r);
      e.style.setProperty('--rm', rm);
      return e;
    }

    // Gridlines + Y axis line behind the bars.
    var plot = place(el('div', 'compare-gridlines'), '1 / ' + (n + 1), '1 / ' + (2 * n + 1));
    c.ticks.forEach(function (t) {
      var line = el('span');
      line.style.left = (t.value / c.max * 100) + '%';
      plot.appendChild(line);
    });
    grid.appendChild(plot);

    c.rows.forEach(function (r, i) {
      grid.appendChild(place(el('div', 'compare-label', r.name), i + 1, 2 * i + 1));
      var cell = place(el('div', 'compare-cell'), i + 1, 2 * i + 2);
      if (r.value === null) {
        cell.appendChild(el('span', 'compare-value compare-missing', r.text));
      } else {
        var ratio = r.value / c.max;
        var bar = el('span', 'compare-bar');
        bar.style.width = (ratio * 100) + '%';
        var val = el('span', 'compare-value', r.text);
        val.style.left = (ratio * 100) + '%';
        cell.appendChild(bar);
        cell.appendChild(val);
      }
      grid.appendChild(cell);
    });

    // X axis scale.
    var axis = place(el('div', 'compare-axis'), n + 1, 2 * n + 1);
    c.ticks.forEach(function (t) {
      var lbl = el('span', null, t.text);
      lbl.style.left = (t.value / c.max * 100) + '%';
      axis.appendChild(lbl);
    });
    grid.appendChild(axis);
    fig.appendChild(grid);

    var dl = el('button', 'compare-download', 'Download PNG');
    dl.type = 'button';
    dl.addEventListener('click', function () { downloadPng(c); });
    fig.appendChild(dl);
    return fig;
  }

  // Draw the chart onto a 4K (3840x2160) canvas, styled like the video graphics, and save it.
  // Layout is in 1920x1080 units, scaled 2x so everything stays crisp at 4K.
  function downloadPng(c) {
    var W = 1920, H = 1080, S = 2;
    var canvas = document.createElement('canvas');
    canvas.width = W * S;
    canvas.height = H * S;
    var ctx = canvas.getContext('2d');
    ctx.scale(S, S);
    var font = '"Helvetica Neue", Helvetica, Arial, sans-serif';

    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a0a0a');
    bg.addColorStop(1, '#3a3a3a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 56px ' + font;
    ctx.fillText(c.metric.title, W / 2, 150, W - 160);

    // Muted units / direction line, styled like the source credit.
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '22px ' + font;
    ctx.fillText(c.pngSubtitle, W / 2, 205);

    var n = c.rows.length;
    var top = 270, bottom = H - 170;
    var rowH = (bottom - top) / n;
    var barH = Math.min(rowH * 0.72, 100);
    var labelSize = Math.max(18, Math.min(34, rowH * 0.42));

    // Label column sized to the longest name, capped at ~a third of the width.
    ctx.font = labelSize + 'px ' + font;
    var labelW = Math.min(W * 0.32, Math.max.apply(null, c.rows.map(function (r) {
      return ctx.measureText(r.name).width;
    })));
    var x0 = 120 + labelW + 30;
    ctx.font = (labelSize + 4) + 'px ' + font;
    var valueW = Math.max.apply(null, c.rows.map(function (r) { return ctx.measureText(r.text).width; }));
    var x1 = W - 120 - Math.max(0, valueW - 60);
    var scale = function (v) { return x0 + (x1 - x0) * v / c.max; };

    // Gridlines and tick labels.
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 2;
    ctx.fillStyle = '#fff';
    ctx.font = '34px ' + font;
    ctx.textAlign = 'center';
    c.ticks.forEach(function (t) {
      var x = Math.round(scale(t.value) * S) / S + 0.25;
      ctx.beginPath();
      ctx.moveTo(x, top - 20);
      ctx.lineTo(x, bottom + 10);
      ctx.stroke();
      ctx.fillText(t.text, x, bottom + 60);
    });

    c.rows.forEach(function (r, i) {
      var cy = top + rowH * (i + 0.5);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = labelSize + 'px ' + font;
      ctx.fillText(r.name, x0 - 30, cy, labelW);
      ctx.textAlign = 'left';
      ctx.font = (labelSize + 4) + 'px ' + font;
      if (r.value === null) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText(r.text, x0 + 14, cy);
        return;
      }
      var w = scale(r.value) - x0;
      ctx.fillStyle = '#00a6ff';
      ctx.fillRect(x0, cy - barH / 2, Math.max(w, 2), barH);
      ctx.fillStyle = '#fff';
      ctx.fillText(r.text, x0 + w + 14, cy);
    });

    // Muted source credit, centered along the bottom edge.
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '22px ' + font;
    ctx.fillText("Benchmark data from Jeff Geerling's SBC Reviews repository: sbc-reviews.jeffgeerling.com", W / 2, H - 36);

    var name = c.metric.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    canvas.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, 'image/png');
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
